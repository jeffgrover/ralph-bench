<!doctype html>
<meta charset="utf-8">
<title>Busy Intersection gates fixture</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#eef;font-family:system-ui}
  #scene{position:relative;width:100%;height:100%;background:linear-gradient(90deg,transparent 42%,#38454f 42% 58%,transparent 58%),linear-gradient(transparent 40%,#38454f 40% 60%,transparent 60%)}
  #scene:after{content:"gates/v1 fixture";position:absolute;left:20px;top:20px;font-weight:700}
  .car,.ped{position:absolute;left:50%;top:50%;transition-property:transform;transition-timing-function:linear;will-change:transform}
  .car{width:24px;height:13px;border-radius:4px;background:#55d6be;transition-duration:.7s}
  .ped{width:11px;height:11px;border-radius:50%;background:#ff7b72;transition-duration:.9s}
</style>
<div id="scene" aria-label="Busy Intersection gates fixture"></div>
<script>
(() => {
  const scene = document.querySelector("#scene");
  const point = {
    north: [0, -520], east: [820, 0], south: [0, 520], west: [-820, 0]
  };
  function carArrived(request) {
    const car = document.createElement("div");
    car.className = "car";
    scene.append(car);
    const start = point[request.entersFrom];
    const finish = point[request.exitsTo];
    car.style.transform = `translate(${start[0]}px,${start[1]}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      car.style.transform = `translate(${finish[0]}px,${finish[1]}px)`;
    }));
    setTimeout(() => {
      window.RalphGates?.carFinished(request.id, request.exitsTo);
      car.remove();
    }, 720);
  }
  function pedestrianArrived(request) {
    const ped = document.createElement("div");
    ped.className = "ped";
    scene.append(ped);
    const horizontal = request.direction.includes("east") || request.direction.includes("west");
    const start = horizontal ? [-120, request.crossing === "north" ? -105 : 105] : [request.crossing === "east" ? 125 : -125, -105];
    const finish = horizontal ? [120, start[1]] : [start[0], 105];
    ped.style.transform = `translate(${start[0]}px,${start[1]}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ped.style.transform = `translate(${finish[0]}px,${finish[1]}px)`;
    }));
    setTimeout(() => {
      window.RalphGates?.pedestrianFinished(request.id);
      ped.remove();
    }, 920);
  }
  if (window.RalphGates) {
    RalphGates.register({carArrived, pedestrianArrived});
  } else {
    let id = 0;
    setInterval(() => carArrived({id:`demo-${++id}`,entersFrom:"north",exitsTo:"south"}), 1000);
  }
})();
</script>
