<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ralph reference intersection</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121e;color:#edf6ff}body{display:grid;place-items:center}main{position:relative;width:100vw;height:100vh;min-width:900px;min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#1c3b4a 0,#102534 36%,#08121e 78%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;left:32px;top:28px;pointer-events:none}.brand,.card{background:rgba(7,18,30,.82);border:1px solid rgba(174,224,239,.2);box-shadow:0 12px 35px rgba(0,0,0,.25);backdrop-filter:blur(12px);border-radius:14px}.brand{padding:15px 18px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8de4dc;font-weight:700}.title{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:4px}.sub{color:#9eb7c7;font-size:12px;margin-top:3px}.stats{position:absolute;right:32px;top:28px;width:214px;padding:15px}.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(174,224,239,.12);font-size:12px}.stat:last-child{border-bottom:0}.stat b{font-size:16px;color:#f8d67a}.legend{position:absolute;left:32px;bottom:30px;padding:12px 14px;font-size:11px;color:#b2cad7}.legend span{display:inline-flex;align-items:center;margin-right:13px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.green{background:#66e3b4}.amber{background:#f8d67a}.red{background:#ff7184}.note{position:absolute;right:32px;bottom:30px;padding:10px 13px;color:#9eb7c7;font-size:11px}
</style>
<main><canvas id="scene" aria-label="Ralph reference traffic intersection"></canvas><div class="hud"><div class="brand"><div class="eyebrow">Ralph / calibration reference</div><div class="title">Harbor &amp; Meridian</div><div class="sub">safe-flow reference · gates/v1</div></div></div><div class="card stats"><div class="eyebrow">live observation</div><div class="stat"><span>phase</span><b id="phase">north / south</b></div><div class="stat"><span>served</span><b id="served">0</b></div><div class="stat"><span>waiting</span><b id="waiting">0</b></div><div class="stat"><span>mode</span><b id="mode">standby</b></div></div><div class="card legend"><span><i class="dot green"></i>moving</span><span><i class="dot amber"></i>queued</span><span><i class="dot red"></i>stop</span></div><div class="card note">evaluator-owned arrivals · no network · reference only</div></main>
<script>
(()=>{"use strict";
const canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d"),phaseEl=document.querySelector("#phase"),servedEl=document.querySelector("#served"),waitingEl=document.querySelector("#waiting"),modeEl=document.querySelector("#mode");
const sides=["north","east","south","west"],colors=["#66e3b4","#65b8ff","#f8d67a","#ff8e9b"],state={cars:[],peds:[],activeCar:null,activePed:null,served:0,started:false,last:0,phase:0,phaseAt:0};const phaseNames=["north / south","east / west","pedestrian walk"],slotMs=560;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();function center(){return[innerWidth*.5,innerHeight*.53]}function edge(side){const[cx,cy]=center(),r=Math.min(innerWidth,innerHeight)*.42,m=100;return{north:[cx,cy-r-m],east:[cx+r+m,cy],south:[cx,cy+r+m],west:[cx-r-m,cy]}[side]}
function compatible(car){return state.phase===0?(car.from==="north"||car.from==="south"):state.phase===1?(car.from==="east"||car.from==="west"):state.phase===2&&!state.peds.length&&!state.activePed}function pathPoint(car,t){const[cx,cy]=center(),a=edge(car.from),b=edge(car.to),turn=(sides.indexOf(car.to)-sides.indexOf(car.from)+4)%4,u=Math.min(1,Math.max(0,t)),q=1-u,bend=turn===2?[cx,cy]:[cx+(b[1]-a[1])*.12,cy-(b[0]-a[0])*.12];return[q*q*a[0]+2*q*u*bend[0]+u*u*b[0],q*q*a[1]+2*q*u*bend[1]+u*u*b[1]]}function pedPoint(p,t){const[cx,cy]=center(),r=Math.min(innerWidth,innerHeight)*.13,h=p.crossing==="north"||p.crossing==="south",y=cy+(p.crossing==="north"?-r:r),x=cx+(p.crossing==="west"?-r:r),u=t*2-1;return h?[cx+u*r,y]:[x,cy+u*r]}
function carArrived(req){state.cars.push({id:req.id,from:req.entersFrom,to:req.exitsTo,t:0})}function pedestrianArrived(req){state.peds.push({id:req.id,crossing:req.crossing,direction:req.direction,t:0})}if(window.RalphGates)window.RalphGates.register({carArrived,pedestrianArrived});else{let id=0;setInterval(()=>carArrived({id:`demo-${++id}`,entersFrom:sides[id%4],exitsTo:sides[(id+2)%4]}),1400)}
function finishCar(car){window.RalphGates?.carFinished(car.id,car.to);state.served++}function finishPed(p){window.RalphGates?.pedestrianFinished(p.id);state.served++}function serve(now){if(!state.activeCar&&state.phase<2){const i=state.cars.findIndex(compatible);if(i>=0&&now-state.phaseAt>700)state.activeCar=state.cars.splice(i,1)[0]}if(!state.activePed&&state.phase===2&&state.peds.length)state.activePed=state.peds.shift()}
function tick(now){if(!state.started){state.started=true;state.last=now;state.phaseAt=now}const dt=Math.min(50,now-state.last||16);state.last=now;if(now-state.phaseAt>=4000){state.phase=(state.phase+1)%3;state.phaseAt=now}serve(now);if(state.activeCar&&(state.activeCar.t+=dt/slotMs)>=1){finishCar(state.activeCar);state.activeCar=null}if(state.activePed&&(state.activePed.t+=dt/900)>=1){finishPed(state.activePed);state.activePed=null}draw();requestAnimationFrame(tick)}
function road(){const[cx,cy]=center(),w=Math.min(innerWidth,innerHeight)*.19;ctx.fillStyle="#1c2f3b";ctx.fillRect(cx-w,0,w*2,innerHeight);ctx.fillRect(0,cy-w,innerWidth,w*2);ctx.strokeStyle="rgba(220,241,242,.22)";ctx.lineWidth=2;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(cx-w/2,0);ctx.lineTo(cx-w/2,innerHeight);ctx.moveTo(cx+w/2,0);ctx.lineTo(cx+w/2,innerHeight);ctx.moveTo(0,cy-w/2);ctx.lineTo(innerWidth,cy-w/2);ctx.moveTo(0,cy+w/2);ctx.lineTo(innerWidth,cy+w/2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="rgba(151,224,215,.18)";for(let i=-3;i<4;i++){ctx.fillRect(cx-w+i*18,cy-w-18,10,8);ctx.fillRect(cx-w+i*18,cy+w+10,10,8);ctx.fillRect(cx-w-18,cy-w+i*18,8,10);ctx.fillRect(cx+w+10,cy-w+i*18,8,10)}}
function signal(x,y,green){ctx.fillStyle="#09151f";ctx.beginPath();ctx.roundRect(x-10,y-29,20,58,10);ctx.fill();[[0,-17,"#ff7184"],[0,0,"#f8d67a"],[0,17,"#66e3b4"]].forEach(([dx,dy,c],i)=>{ctx.fillStyle=i===2&&green?c:i===1&&!green?c:i===0&&!green?c:"#29404b";ctx.beginPath();ctx.arc(x+dx,y+dy,5,0,Math.PI*2);ctx.fill()})}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);const[cx,cy]=center();ctx.fillStyle="#0d2430";ctx.fillRect(0,0,innerWidth,innerHeight);road();ctx.fillStyle="rgba(85,180,160,.08)";ctx.beginPath();ctx.arc(cx,cy,Math.min(innerWidth,innerHeight)*.18,0,Math.PI*2);ctx.fill();signal(cx-85,cy-85,state.phase===0);signal(cx+85,cy+85,state.phase===0);signal(cx+85,cy-85,state.phase===1);signal(cx-85,cy+85,state.phase===1);state.cars.forEach((car,i)=>drawCar(edge(car.from),colors[i%colors.length],true));if(state.activeCar)drawCar(pathPoint(state.activeCar,state.activeCar.t),"#fff3c4",false);state.peds.forEach(p=>drawPed(pedPoint(p,.05),"#f8d67a"));if(state.activePed)drawPed(pedPoint(state.activePed,state.activePed.t),"#f7a6ff");phaseEl.textContent=phaseNames[state.phase];servedEl.textContent=state.served;waitingEl.textContent=state.cars.length+state.peds.length+(state.activeCar?1:0)+(state.activePed?1:0);modeEl.textContent=state.started?"running":"standby"}
function drawCar(pos,color,queued){const[x,y]=pos;ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(-17,5,34,7);ctx.fillStyle=queued?"#466675":color;ctx.beginPath();ctx.roundRect(-15,-6,30,12,4);ctx.fill();ctx.fillStyle="#b9edf1";ctx.fillRect(-5,-4,10,4);ctx.restore()}function drawPed(pos,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(pos[0],pos[1],6,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.5)";ctx.stroke()}draw();requestAnimationFrame(tick)})();
</script>
